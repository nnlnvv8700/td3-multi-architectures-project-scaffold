# Corrected TD3 with time-aligned tracking costs and optional kinematic residual control.
# Candidate hyperparameters, not claims of optimality.
algorithm_version: corrected
actor_arch: gnn_transformer
observation_version: 2
reward_mode: tracking
control_mode: residual
residual_scale: 0.2
zero_init_actor: true
controller_gain: 4.0
controller_damping: 0.05
joint_limit_margin: 0.05
tracking_position_scale: 0.10
tracking_terminal_scale: 0.05
tracking_smooth_weight: 0.02
tracking_terminal_weight: 2.0
tracking_success_threshold: 0.05
distance_threshold: 0.10
actor_lr: 0.0001
critic_lr: 0.0003
critic_loss: huber
gamma: 0.99
tau: 0.005
policy_delay: 2
policy_noise: 0.15
noise_clip: 0.3
expl_noise: 0.3
expl_noise_final: 0.03
batch_size: 256
buffer_size: 500000
max_timesteps: 500000
start_timesteps: 5000
eval_freq: 5000
eval_episodes: 20
use_per: true
per_alpha: 0.6
per_beta_start: 0.4
seed: 42
eval_seed: 10000
save_dir: ./results/algorithm_v2
