[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".codex-tools", "results", "tmp", "plots", "plots_result"]

[tool.ruff.lint]
# Correctness checks across the legacy tree; avoid unrelated mass formatting.
select = ["E9", "F63", "F7", "F82"]
